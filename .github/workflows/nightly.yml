name: Nightly resilience

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.1'
          cache: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Run dependency, failover, and performance suites
        run: bash scripts/run-integration-matrix.sh --nightly
      - name: Release Docker build cache
        run: docker builder prune --force
      - name: Install web dependencies and Chromium
        run: |
          cd web
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Build web and run browser acceptance
        run: |
          cd web
          bun run build
          bun run e2e
      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence-${{ github.run_id }}
          path: |
            artifacts/nightly/*.json
            web/playwright-report
            web/test-results
          if-no-files-found: warn
          retention-days: 30
