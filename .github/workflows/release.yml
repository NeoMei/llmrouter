name: Release (Linux, macOS, Windows)
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -trimpath -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-arm64-$VERSION
      - name: Build and probe Electron candidate
        run: |
          cd electron
          npm ci
          VERSION="$VERSION" npm run build:all
          npm run probe -- dist --write-checksums
          cp dist/SHA256SUMS ../electron-SHA256SUMS-linux.txt
      - name: Generate checksums
        run: sha256sum new-api-* > checksums-linux.txt
      - name: Probe native binary and record evidence
        run: |
          PORT=31991 OBJECT_STORE_TYPE=local OBJECT_STORE_LOCAL_ROOT=/tmp/codex-gateway-release-files ./new-api-$VERSION > startup-linux.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for attempt in {1..60}; do curl --fail --silent http://127.0.0.1:31991/healthz && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:31991/healthz
          checksum=$(sha256sum electron-SHA256SUMS-linux.txt | awk '{print $1}')
          backend_checksum=$(sha256sum new-api-$VERSION | awk '{print $1}')
          jq -n --arg commit "$GITHUB_SHA" --arg checksum "$checksum" --arg backend_checksum "$backend_checksum" '{commit:$commit,platform:"linux",checksum:$checksum,backend_checksum:$backend_checksum,startup_probe:"pass"}' > desktop-linux.json
      - name: Upload Linux release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: |
            new-api-*
            checksums-linux.txt
            desktop-linux.json
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.zip
            electron-SHA256SUMS-linux.txt

  macos:
    name: macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          go build -trimpath -ldflags "-X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-macos-$VERSION
      - name: Build and probe Electron candidate
        run: |
          cd electron
          npm ci
          VERSION="$VERSION" npm run build:all
          npm run probe -- dist --write-checksums
          cp dist/SHA256SUMS ../electron-SHA256SUMS-macos.txt
      - name: Generate checksums
        run: shasum -a 256 new-api-macos-* > checksums-macos.txt
      - name: Probe native binary and record evidence
        run: |
          PORT=31992 OBJECT_STORE_TYPE=local OBJECT_STORE_LOCAL_ROOT=/tmp/codex-gateway-release-files ./new-api-macos-$VERSION > startup-macos.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for attempt in {1..60}; do curl --fail --silent http://127.0.0.1:31992/healthz && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:31992/healthz
          checksum=$(shasum -a 256 electron-SHA256SUMS-macos.txt | awk '{print $1}')
          backend_checksum=$(shasum -a 256 new-api-macos-$VERSION | awk '{print $1}')
          jq -n --arg commit "$GITHUB_SHA" --arg checksum "$checksum" --arg backend_checksum "$backend_checksum" '{commit:$commit,platform:"macos",checksum:$checksum,backend_checksum:$backend_checksum,startup_probe:"pass"}' > desktop-macos.json
      - name: Upload macOS release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            new-api-macos-*
            checksums-macos.txt
            desktop-macos.json
            electron/dist/*.dmg
            electron/dist/*.zip
            electron-SHA256SUMS-macos.txt

  windows:
    name: Windows Release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          go build -trimpath -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-$VERSION.exe
      - name: Build and probe Electron candidate
        run: |
          cd electron
          npm ci
          VERSION="$VERSION" npm run build:all
          npm run probe -- dist --write-checksums
          cp dist/SHA256SUMS ../electron-SHA256SUMS-windows.txt
      - name: Generate checksums
        run: sha256sum new-api-*.exe > checksums-windows.txt
      - name: Probe native binary and record evidence
        run: |
          PORT=31993 OBJECT_STORE_TYPE=local OBJECT_STORE_LOCAL_ROOT="$RUNNER_TEMP/codex-gateway-release-files" ./new-api-$VERSION.exe > startup-windows.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for attempt in {1..60}; do curl --fail --silent http://127.0.0.1:31993/healthz && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:31993/healthz
          checksum=$(sha256sum electron-SHA256SUMS-windows.txt | awk '{print $1}')
          backend_checksum=$(sha256sum new-api-$VERSION.exe | awk '{print $1}')
          jq -n --arg commit "$GITHUB_SHA" --arg checksum "$checksum" --arg backend_checksum "$backend_checksum" '{commit:$commit,platform:"windows",checksum:$checksum,backend_checksum:$backend_checksum,startup_probe:"pass"}' > desktop-windows.json
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            new-api-*.exe
            checksums-windows.txt
            desktop-windows.json
            electron/dist/*.exe
            electron/dist/*.zip
            electron-SHA256SUMS-windows.txt

  container:
    name: Immutable container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push current revision
        id: image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=true \
            --sbom=true \
            --tag "$IMAGE:$VERSION" \
            --metadata-file image-metadata.json \
            --push .
          DIGEST=$(jq -r '."containerimage.digest"' image-metadata.json)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
      - name: Sign immutable image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: gh attestation build-provenance --subject-name "$IMAGE" --subject-digest "$DIGEST" --push-to-registry
      - name: Smoke immutable image and record evidence
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          container=$(docker run --detach --publish 31994:3000 \
            --env PORT=3000 --env OBJECT_STORE_TYPE=local \
            --env OBJECT_STORE_LOCAL_ROOT=/tmp/codex-gateway-files \
            "$IMAGE@$DIGEST")
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..60}; do curl --fail --silent http://127.0.0.1:31994/healthz && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:31994/healthz
          jq -n --arg commit "$GITHUB_SHA" --arg digest "$DIGEST" \
            '{commit:$commit,digest:$digest,signed:true,sbom:true,provenance:true,container_smoke:true}' > image.json
      - name: Upload container evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-evidence
          path: |
            image.json
            image-metadata.json

  certification:
    name: Quality and live provider certification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production-certification
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.1'
          cache: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install web and browser dependencies
        run: |
          cd web
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Run deterministic package gates
        run: |
          bash scripts/verify-backend.sh
          bash scripts/verify-web.sh
          bash scripts/verify-cli.sh
          cd web && bun run e2e
      - name: Run dependency, resilience, billing, and restore gates
        run: bash scripts/run-integration-matrix.sh --nightly
      - name: Materialize protected certification inputs
        env:
          CASES_B64: ${{ secrets.PROVIDER_CERTIFICATION_CASES_B64 }}
          SIGNING_KEY_B64: ${{ secrets.PROVIDER_CERTIFICATION_SIGNING_KEY_B64 }}
          TOKENS_B64: ${{ secrets.PROVIDER_CERTIFICATION_TOKENS_JSON_B64 }}
        run: |
          test -n "$CASES_B64"
          test -n "$SIGNING_KEY_B64"
          test -n "$TOKENS_B64"
          umask 077
          printf '%s' "$CASES_B64" | base64 --decode > "$RUNNER_TEMP/provider-cases.json"
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/provider-signing-key.pem"
          printf '%s' "$TOKENS_B64" | base64 --decode > "$RUNNER_TEMP/provider-tokens.json"
      - name: Run live provider certification
        env:
          CERTIFICATION_GATEWAY_URL: ${{ secrets.CERTIFICATION_GATEWAY_URL }}
          CERTIFICATION_CASES_FILE: ${{ runner.temp }}/provider-cases.json
          CERTIFICATION_SIGNING_KEY: ${{ runner.temp }}/provider-signing-key.pem
          CERTIFICATION_TOKENS_FILE: ${{ runner.temp }}/provider-tokens.json
          CERTIFICATION_OUTPUT_DIR: artifacts/nightly
          CERTIFICATION_BUILD_VERSION: ${{ github.sha }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/certify-providers.sh
      - name: Certify supported paths and generated docs
        env:
          PROVIDER_CERTIFICATION_MANIFEST: artifacts/nightly/provider-certification.json
          CERTIFICATION_OUTPUT_DIR: artifacts/nightly
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/certify-source.sh
      - name: Upload certification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certification-evidence
          path: artifacts/nightly
          if-no-files-found: error

  release-gate:
    name: Aggregate release gate and publish
    needs: [linux, macos, windows, container, certification]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Download release evidence and candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '*'
          path: collected
          merge-multiple: true
      - name: Assemble commit-bound evidence
        run: |
          mkdir -p artifacts/release
          cp collected/provider-certification.* artifacts/release/
          cp collected/image.json artifacts/release/image.json
          cp collected/restore-rehearsal.json artifacts/release/restore-rehearsal.json
          cp collected/nightly.json artifacts/release/nightly.json
          cp collected/source.json artifacts/release/source.json
          jq -n --arg commit "$GITHUB_SHA" \
            --slurpfile linux collected/desktop-linux.json \
            --slurpfile macos collected/desktop-macos.json \
            --slurpfile windows collected/desktop-windows.json \
            '{commit:$commit,platforms:{linux:$linux[0],macos:$macos[0],windows:$windows[0]}}' \
            > artifacts/release/desktop.json
      - name: Enforce aggregate release gate
        env:
          RELEASE_GATE_FAST: '1'
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/release-gate.sh
      - name: Publish certified release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            collected/new-api-*
            collected/checksums-*.txt
            collected/electron/dist/*
            collected/electron-SHA256SUMS-*.txt
            artifacts/release/*.json
            artifacts/release/provider-certification.sig
            artifacts/release/provider-certification.pub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
