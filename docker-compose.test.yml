name: codex-gateway-test

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: test-only-postgres-secret
      POSTGRES_DB: gateway
    ports: ["55432:5432"]
  mysql:
    image: mysql:8.4.2
    environment:
      MYSQL_ROOT_PASSWORD: test-only-mysql-root-secret
      MYSQL_USER: gateway
      MYSQL_PASSWORD: test-only-mysql-secret
      MYSQL_DATABASE: gateway
    ports: ["53306:3306"]
  redis:
    image: redis:7.4.0-alpine
    command: ["redis-server", "--requirepass", "test-only-redis-secret"]
    ports: ["56379:6379"]
  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-03T04-33-23Z
    command: server /data
    environment:
      MINIO_ROOT_USER: test-access-key
      MINIO_ROOT_PASSWORD: test-secret-key-that-is-long-enough
    ports: ["59000:9000"]
