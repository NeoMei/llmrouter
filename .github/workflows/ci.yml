name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - llmrouter

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.1'
          cache: true
      - run: bash scripts/verify-backend.sh

  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.1'
          cache: true
      - name: Manifest and asset tests
        run: python3 -m unittest scripts/onboarding_assets_test.py -v
      - name: Go onboarding tests with race detection
        run: go test -race ./internal/onboarding/... ./cmd/llmrouter-onboard/... -count=1
      - name: Bash syntax check
        run: |
          bash -n scripts/build-onboarding-artifacts.sh
          bash -n scripts/onboarding_e2e.sh
      - name: Onboarding e2e
        run: bash scripts/onboarding_e2e.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Release CI workflow contracts
        run: python3 -m unittest scripts/release_ci_contract_test.py -v
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bash scripts/verify-web.sh

      - name: Onboarding manifest in build output
        working-directory: web
        run: |
          test -f dist/install/manifest.json
          python3 -m json.tool dist/install/manifest.json > /dev/null

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - run: bash scripts/verify-cli.sh
