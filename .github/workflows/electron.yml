name: Electron

on:
  pull_request:
    paths:
      - 'electron/**'
      - 'web/**'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/electron.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: electron-linux
          - os: macos-latest
            artifact: electron-macos
          - os: windows-latest
            artifact: electron-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Build and package current revision
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VERSION: ${{ github.ref_name || github.sha }}
        run: cd electron && npm run build:all
      - name: Probe unpacked package and write checksums
        run: cd electron && npm run probe -- dist --write-checksums
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/SHA256SUMS
          if-no-files-found: error
